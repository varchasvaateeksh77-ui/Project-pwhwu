[build]
  publish = "publish"
  command = "npm run build && rm -rf publish && cp -r dist publish"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cats/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
